<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1120"><title>TrainHard PWA</title><link rel="manifest" href="manifest.json"><script src="https://unpkg.com/html5-qrcode"></script><style>:root{--bg:#0b1120;--line:rgba(255,255,255,.08);--txt:#e5eefc;--muted:#94a3b8;--accent:#8b5cf6;--accent2:#14b8a6;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444}*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden}body{font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#172554 0%,var(--bg) 55%);color:var(--txt)}header{position:sticky;top:0;z-index:100;background:rgba(11,17,32,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#fff}.title{font-weight:900;font-size:22px}.sub{font-size:12px;color:var(--muted)}.hero{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(20,184,166,.10))}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:800}.nav{display:flex;gap:8px;overflow:auto;padding:12px 0 8px;position:sticky;top:82px;z-index:95;background:linear-gradient(180deg,rgba(11,17,32,.98),rgba(11,17,32,.85))}.tab{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap;cursor:pointer;flex:0 0 auto}.tab.on{background:linear-gradient(135deg,var(--accent),#a855f7);bord nel{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.alt-panel.on{display:block}.alt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.alt-item{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer}.alt-item.sel{background:rgba(20,184,166,.22);border-color:rgba(20,184,166,.5)}.history-item{border-top:1px solid var(--line);padding:10px 0}.delwrap{display:flex;justify-content:space-between;align-items:center;gap:8px}.del{border:none;background:rgba(239,68,68,.15);color:#fca5a5;border-radius:999px;padding:6px 10px;font-weight:800;cursor:pointer}.scanbox{padding:14px;border:1px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.03)}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px}.stat .k{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.stat .v{font-weight:900;font-size:20px}.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(11,17,32,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 12px}.barbtn{border:none;background:rgba(255,255,255,.04);color:var(--txt);border-radius:12px;padding:9px 10px;font-size:12px;font-weight:800;cursor:pointer}.barbtn.on{background:rgba(139,92,246,.22);color:#ddd6fe}@media(max-width:720px){.row,.daytabs,.statgrid,.alt-grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><div class="top"><div class="brand"><div class="logo">TH</div><div><div class="title">TrainHard PWA</div><div class="sub">7 giorni dieta + sostituzioni dirette + scanner barcode</div></div></div><div class="chip">Ready</div></div><div class="hero"><div class="big">Allenamento e dieta impostati</div><div class="muted">Le sostituzioni cambiano davvero il pasto. Scanner con s','row',['Rematore manubrio','Seated cable row','TRX row']],['Face pull','3x15 · 45s','face',['Rear delt fly','Cable external rotation','Band pull-apart']],['Curl con bilanciere','3x12 · 45s','curl',['Curl alternato','Hammer curl','Curl Scott']],['Circuit finisher','10 min','pulley',['Burpees 20s','Mountain climbers','Sprint sul posto']]],3:[['Squat con bilanciere','4x10-12 · 90s','squat',['Leg press','Goblet squat','Hack squat']],['Stacco rumeno','4x10 · 90s','rdl',['Leg curl','Good morning','Hip hinge band']],['Hip thrust con bilanciere','3x15 · 60s','hip',['Glute bridge','Cable pull-through','Step up']],['Affondi camminati','3x12 gamba · 60s','lunge',['Affondi statici','Bulgarian split squat','Step up manubri']],['HIIT ciclismo','15 min','curlleg',['Bike 40/20','Tapis 1 min','Cyclette costante']]],4:[['Panca piana manubri','4x8-10 · 75s','bench',['Chest press','Panca inclinata','Push-up']),['Lat machine neutra','4x10 · 60s','lat',['Pulldown stretta','Trazioni assistite','Rematore macchina']),['Hip thrust','4x12 · 60s','hip',['Glute bridge','Pull-through','Leg curl']),['Face pull','3x15 · 45s','face',['Reverse fly','Band pull-apart','Rear delt machine']),['Bike Zone 2','20 min','curlleg',['Ellittica','Tapis veloce','Remoergometro']]],5:[['Squat frontale','4x8-10 · 90s','squat',['Goblet squat','Hack squat','Leg press']),['Rematore manubrio','4x10 · 60s','row',['Chest-supported row','Seated row','TRX row']),['Dips alle parallele','3x8-12 · 60s','dips',['Pushdown rope','Panca stretta','French press']),['Curl bilanciere','3x12 · 45s','curl',['Hammer curl','Curl Scott','Cavo']),['HIIT finale','12 min','french',['Bike 30/30','Sprint','Jump rope']]],6:[['Stacco rumeno','4x8-10 · 90s','rdl',['Hip hinge band','Leg curl','Good morning']),['Pulley basso','4x10-12 · 60s','pulley',['Seated cable row','T-Bar row','Rematore macchina']),['Affondi camminati','3x12 gamba · 60s','lunge',['Affondi statici','Step up','Bulgarian split squat']),['Face pull','3x15 · 45s','face',['Rear d erluzzo 220 g']],['Spuntino',['Shake 30 g','Budino proteico 200 g','Yogurt greco 250 g']],['Cena',['Tacchino 200 g + riso 70 g','Pollo 200 g + verdure + pane 50 g','Merluzzo 250 g + patate 250 g']]]},{d:'Day 6',k:2360,meal:'Più leggero, molto pulito.',items:[['Colazione','skyr · frutta · avena'],['Spuntino','shake'],['Pranzo','pollo · riso · verdure'],['Spuntino','yogurt'],['Cena','uova · pane · insalata']],alts:[['Colazione',['Skyr 250 g + frutta','Avena 50 g + yogurt 250 g','Uova 2 + albumi 200 g']],['Spuntino',['Shake 30 g','Barretta proteica 1 pz','Budino proteico 200 g']],['Pranzo',['Riso 90 g + pollo 180 g','Pasta 80 g + tonno 160 g','Tacchino 200 g + patate 250 g']],['Spuntino',['Yogurt greco 250 g','Frutta + mandorle 15 g','Shake 30 g']],['Cena',['Uova 3 + verdure + pane 60 g','Merluzzo 250 g + patate 250 g','Tacchino 180 g + insalata + riso 60 g']]]},{d:'Day 7',k:2300,meal:'Recupero attivo, più flessibile.',items:[['Colazione','yogurt · avena · banana'],['Spuntino','frutta · mandorle'],['Pranzo','riso · merluzzo · verdure'],['Spuntino','shake proteico'],['Cena','pollo · patate · insalata']],alts:[['Colazione',['Yogurt greco 250 g + avena 50 g + banana','Skyr 250 g + frutta','Uova 3 + pane 70 g']],['Spuntino',['Frutta + 20 g mandorle','Barretta proteica 1 pz','Budino proteico 200 g']],['Pranzo',['Riso 80 g + merluzzo 250 g','Pasta 80 g + pollo 180 g','Tacchino 200 g + patate 250 g']],['Spuntino',['Shake 30 g','Yogurt greco 250 g','Frutta + skyr']],['Cena',['Pollo 200 g + patate 250 g','Merluzzo 250 g + verdure + pane 50 g','Uova 3 + insalata + riso 60 g']]]}];function show(id,btn){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));document.querySelectorAll('.tab,.barbtn').forEach(b=>b.classList.remove('on'));document.getElementById(id).classList.add('on');btn.classList.add('on')}function showDay(n,btn){btn.parentElement.querySelectorAll('.daytab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.querySelectorAll('.box').forEach(b=>b.classList.remove('on'));document.getElementById('day'+n).classList.add('on')}function workout(){return `<div class='daytabs'>${Array.from({length:7},(_,i)=>`<button class='daytab ${i===0?'on':''}' onclick='showDay(${i+1},this)'>Day ${i+1}</button>`).join('')}</div>${[1,2,3,4,5,6,7].map(n=>`<div id='day${n}' class='box ${n===1?'on':''}'>${plan[n].map(x=>`<div class='ex'><div class='exh'><div class='media'><img src='${imgs[x[2]]}' alt='${x[0]}'></div><div style='flex:1'><div class='big' style='font-size:15px'>${x[0]}</div><div><span class='pill'>${x[1]}</span><span class='pill'>Cardio incluso</span></div><div class='muted' style='margin-top:6px'>${x[3].join(' · ')}</div></div></div></div>`).join('')}</div>`).join('')}<div class='card'><div class='big'>Programma 7 giorni</div><div class='muted'>Split impostato con recuperi e cardio integrato.</div></div>`}function nutrition(){const total=week.reduce((s,d)=>s+d.k,0);return `<div class='card' style='background:linear-gradient(135deg,#7c3aed,#14b8a6);color:#fff'><div class='big'>Media giornaliera</div><div style='font-weight:900;font-size:54px;line-height:1'>${Math.round(total/7)} <span style='font-size:18px;font-weight:400'>kcal</span></div><div class='statgrid'><div class='stat'><div class='k'>Giorni</div><div class='v'>7</div></div><div class='stat'><div class='k'>Pasti</div><div class='v'>5</div></div><div class='stat'><div class='k'>Goal</div><div class='v'>Cut</div></div></div></div>${week.map((d,i)=>`<div class='meal-card' id='meal-${i}'><div class='meal-top'><div><div class='chip'>${d.d}</div><div class='big' style='font-size:15px;margin-top:8px'>${d.meal}</div><div class='muted'>${d.meal}</div></div><div class='meal-kcal'>${d.k}</div></div><ul class='meal-items'>${d.items.map(v=>`<li class='history-item'><div><strong>${v[0]}</strong><div class='muted'>${v[1]}</div></div></li>`).join('')}</ul><div class='meal-actions'><button class='btn g' onclick="recordDay(${i})">Registra day</button><button class='btn a' onclick="toggleAlt(${i})">Sostituzione</button></div><div class='alt-panel' id='alt-${i}'>${d.alts.map((a,j)=>`<div style='margin-bottom:10px'><div class='muted' style='margin-bottom:6px'>${a[0]}</div><div class='alt-grid'>${a[1].map(opt=>`<div class='alt-item' onclick="applySwap(${i},${j},'${opt.replace(/'/g,'\'')}')">${opt}</div>`).join('')}</div></div>`).join('')}</div></div>`).join('')}<div class='card'><div class='big'>Storico pasti</div><div id='mealhist'></div></div>`}function toggleAlt(i){document.getElementById('alt-'+i).classList.toggle('on')}function applySwap(day,mealIndex,text){const card=document.getElementById('meal-'+day);const title=card.querySelector('.big');title.textContent=week[day].d+' — sostituzione applicata';card.querySelector('.meal-items').children[mealIndex].querySelector('strong').textContent=text;card.querySelector('.meal-items').children[mealIndex].querySelector('.muted').textContent='Sostituzione impostata direttamente nel pasto';document.getElementById('alt-'+day).classList.remove('on')}function recordDay(i){const log=JSON.parse(localStorage.getItem('th_days')||'[]');log.push({d:week[i].d,k:week[i].k,t:new Date().toLocaleDateString('it-IT')});localStorage.setItem('th_days',JSON.stringify(log));renderHist()}function deleteDay(i){const log=JSON.parse(localStorage.getItem('th_days')||'[]');log.splice(i,1);localStorage.setItem('th_days',JSON.stringify(log));renderHist()}function renderHist(){const el=document.getElementById('mealhist');const log=JSON.parse(localStorage.getItem('th_days')||'[]');el.innerHTML=!log.length?'<div class="muted" style="margin-top:10px">Nessun day registrato.</div>':log.map((x,i)=>`<div class='history-item'><div class='delwrap'><div><strong>${x.t}</strong><div class='muted'>${x.d} · ${x.k} kcal</div></div><button class='del' onclick='deleteDay(${i})'>Elimina</button></div></div>`).join('')}async function lookup(){const code=document.getElementById('code').value.trim();if(!code)return;document.getElementById('scanout').innerHTML='Ricerca prodotto...';try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');const j=await r.json();if(j.status===1){const p=j.product||{};const score=String(p.nutriscore_grade||'').toLowerCase();const label=score&&['a','b','c'].includes(score)?'Buono':(score&&['d','e'].includes(score)?'Poco buono':'Da valutare');document.getElementById('scanout').innerHTML=`<strong>${p.product_name||'Prodotto trovato'}</strong><br><span class='muted'>${p.brands||'n/d'} · Kcal/100g: ${p.nutriments?.['energy-kcal_100g']||'n/d'}</span><br><span class='chip'>Feedback: ${label}</span>`}else document.getElementById('scanout').innerHTML='Prodotto non trovato.'}catch(e){document.getElementById('scanout').innerHTML='Errore ricerca.'}}function manualFeedback(){document.getElementById('scanout').innerHTML='Inserisci un barcode per il feedback automatico.'}let html5QrCode=null;async function startCamera(){try{if(!window.Html5Qrcode){document.getElementById('scanout').innerHTML='Libreria scanner non caricata.';return}if(html5QrCode)await stopCamera();html5QrCode=new Html5Qrcode('reader');await html5QrCode.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async decodedText=>{document.getElementById('code').value=decodedText;await lookup();},()=>{});document.getElementById('scanout').innerHTML='Camera attiva: inquadra il barcode.'}catch(e){document.getElementById('scanout').innerHTML='Camera non disponibile.'}}async function stopCamera(){try{if(html5QrCode){await html5QrCode.stop();await html5QrCode.clear();html5QrCode=null}document.getElementById('reader').innerHTML='';document.getElementById('scanout').innerHTML='Camera fermata.'}catch(e){}}function scannerUI(){document.getElementById('scanner').innerHTML=`<div class='card'><div class='big'>Scanner barcode</div><div class='muted'>Camera + scansione barcode vera. Il codice letto passa alla ricerca prodotto.</div><div class='row' style='margin-top:10px'><button class='btn a' onclick='startCamera()'>Avvia camera</button><button class='btn c' onclick='stopCamera()'>Ferma camera</button></div><div id='reader' class='scanbox' style='margin-top:10px;min-height:300px'></div><input id='code' class='input' placeholder='Codice barcode' style='margin-top:10px'><div class='row' style='margin-top:10px'><button class='btn b' onclick='lookup()'>Cerca prodotto</button><button class='btn g' onclick='manualFeedback()'>Feedback manuale</button></div><div id='scanout' class='scanbox' style='margin-top:10px'>Nessun prodotto scansionato.</div></div>`}function progressUI(){return `<div class='card'><div class='big'>Progressi</div><div class='muted'>Peso, vita e storico con eliminazione singola.</div><div class='row' style='margin-top:10px'><input id='w' class='input' placeholder='Peso kg'><input id='wa' class='input' placeholder='Vita cm'></div><div class='row' style='margin-top:10px'><button class='btn g' onclick='saveProg()'>Salva</button><button class='btn c' onclick='calcBMI()'>BMI</button></div><div id='bmiout' class='scanbox' style='margin-top:10px'>BMI non calcolato.</div></div><div class='card'><div class='big'>Storico</div><div id='hist'></div></div>`}function saveProg(){const w=document.getElementById('w').value,wa=document.getElementById('wa').value;const log=JSON.parse(localStorage.getItem('th_hist')||'[]');log.push({d:new Date().toLocaleDateString('it-IT'),w,wa});localStorage.setItem('th_hist',JSON.stringify(log));renderProgHist()}function deleteProg(i){const log=JSON.parse(localStorage.getItem('th_hist')||'[]');log.splice(i,1);localStorage.setItem('th_hist',JSON.stringify(log));renderProgHist()}function renderProgHist(){const el=document.getElementById('hist');const log=JSON.parse(localStorage.getItem('th_hist')||'[]');el.innerHTML=!log.length?'<div class="muted" style="margin-top:10px">Nessun dato salvato ancora.</div>':log.map((x,i)=>`<div class='history-item'><div class='delwrap'><div><strong>${x.d}</strong><div class='muted'>Peso: ${x.w||'-'} kg · Vita: ${x.wa||'-'} cm</div></div><button class='del' onclick='deleteProg(${i})'>Elimina</button></div></div>`).join('')}function calcBMI(){const w=parseFloat(document.getElementById('w').value);const h=1.78;if(!w){document.getElementById('bmiout').innerHTML='Inserisci il peso.';return}document.getElementById('bmiout').innerHTML='BMI stimato: <strong>'+(w/(h*h)).toFixed(1)+'</strong>'}function renderAll(){document.getElementById('workout').innerHTML=workout();document.getElementById('nutrition').innerHTML=nutrition();scannerUI();document.getElementById('progress').innerHTML=progressUI();renderHist();renderProgHist()}renderAll();</script></body></html>
