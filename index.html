<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1120"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>TrainHard PWA</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><style>:root{--bg:#0b1120;--panel:#111827;--line:rgba(255,255,255,.08);--txt:#e5eefc;--muted:#94a3b8;--accent:#8b5cf6;--accent2:#14b8a6;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444}*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden}body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#172554 0%,var(--bg) 55%);color:var(--txt)}header{position:sticky;top:0;z-index:100;background:rgba(11,17,32,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font:900 18px 'Space Grotesk',system-ui,sans-serif;color:#fff}.title{font:900 22px 'Space Grotesk',system-ui,sans-serif}.sub{font-size:12px;color:var(--muted)}.hero{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(20,184,166,.10));box-shadow:0 16px 40px rgba(0,0,0,.22)}.hero .big{font:900 20px 'Space Grotesk',system-ui,sans-serif}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:800}.nav{display:flex;gap:8px;overflow:auto;padding:12px 0 8px;position:sticky;top:82px;z-index:95;background:linear-gradient(180deg,rgba(11,17,32,.98),rgba(11,17,32,.85));touch-action:pan-x}.tab{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap;cursor:pointer;flex:0 0 auto}.tab.on{background:linear-gradient(135deg,var(--accent),#a855f7);border-color:transparent}.sec{display:none}.sec.on{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:14px}.card{background:linear-gradient(180deg,rgba(17,24,39,.96),rgba(15,23,42,.96));border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 16px 38px rgba(0,0,0,.24)}.big{font:900 18px 'Space Grotesk',system-ui,sans-serif}.muted{color:var(--muted);font-size:13px;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);border-radius:14px;padding:12px 14px;font-weight:700;outline:none}.btn{border:none;border-radius:14px;padding:12px 14px;font-weight:900;cursor:pointer;color:#fff}.a{background:linear-gradient(135deg,var(--accent),#a855f7)}.b{background:linear-gradient(135deg,var(--accent2),#06b6d4)}.c{background:linear-gradient(135deg,var(--warn),#f97316)}.g{background:linear-gradient(135deg,var(--good),#16a34a)}.daytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.daytab{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);border-radius:16px;padding:12px;font-weight:800;cursor:pointer}.daytab.on{background:linear-gradient(135deg,var(--accent),#a855f7)}.box{display:none}.box.on{display:block}.ex{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.03);margin-top:10px}.exh{display:flex;gap:12px;padding:12px;align-items:center;cursor:pointer}.media{width:108px;height:86px;flex:0 0 108px;border-radius:14px;overflow:hidden;background:#111}.media img{width:100%;height:100%;object-fit:cover}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:800;margin-right:6px}.note{border-left:3px solid var(--accent);padding-left:10px;color:#dbe7f7;font-size:13px;margin-top:10px}.meal-card{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.03);padding:14px;margin-top:10px}.meal-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.meal-tag{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:800}.meal-kcal{font:900 18px 'Space Grotesk',system-ui,sans-serif}.meal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.meal-alt{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.meal-alt.on{display:block}.history-item{border-top:1px solid var(--line);padding:10px 0}.delwrap{display:flex;justify-content:space-between;align-items:center;gap:8px}.del{border:none;background:rgba(239,68,68,.15);color:#fca5a5;border-radius:999px;padding:6px 10px;font-weight:800;cursor:pointer}.scanbox{min-height:300px;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px}.stat .k{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.stat .v{font:900 20px 'Space Grotesk',system-ui,sans-serif;margin-top:4px}.rating{font-weight:900}.ok{color:#86efac}.warn{color:#fde68a}.bad{color:#fca5a5}.meal-items{margin:10px 0 0;padding:0;list-style:none}.meal-items li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}.meal-items li:last-child{border-bottom:none}.alt-panel{display:none;margin-top:10px;background:rgba(255,255,255,.04);border-radius:12px;padding:12px}.alt-panel.on{display:block}.alt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.alt-item{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer}.small{font-size:12px;color:var(--muted)}.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(11,17,32,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 12px}.barbtn{border:none;background:rgba(255,255,255,.04);color:var(--txt);border-radius:12px;padding:9px 10px;font-size:12px;font-weight:800}.barbtn.on{background:rgba(139,92,246,.22);color:#ddd6fe}@media(max-width:720px){.row,.alt-grid,.daytabs,.statgrid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><div class="top"><div class="brand"><div class="logo">TH</div><div><div class="title">TrainHard PWA</div><div class="sub">Versione a 4 file: index, manifest, sw, icon</div></div></div><div class="chip">4 files</div></div></div></header><main class="wrap"><div class="card"><div class="big">Quattro file, non tre</div><div class="muted">Questa versione include anche l’icona separata come file distinto, così il pacchetto torna a 4 elementi principali.</div></div></main></body></html>
