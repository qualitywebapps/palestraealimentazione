<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>TrainHard PWA</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><script src="https://unpkg.com/html5-qrcode"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Inter,sans-serif;background:#f5f4f2;color:#18181b}.wrap{max-width:980px;margin:0 auto;padding:16px 16px 96px}header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid #ede9fe;z-index:20}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#14b8a6);display:grid;place-items:center;color:#fff;font-weight:900}.title{font:900 20px 'Space Grotesk',sans-serif}.sub{font-size:12px;color:#71717a}.nav{display:flex;gap:8px;overflow:auto;padding:0 16px 12px}.tab{border:none;background:#ede9fe;color:#7c3aed;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;white-space:nowrap}.tab.on{background:linear-gradient(135deg,#7c3aed,#14b8a6);color:#fff}.sec{display:none}.sec.on{display:block}.card{background:#fff;border:2px solid #ede9fe;border-radius:20px;padding:16px;margin-top:12px}.big{font:900 18px 'Space Grotesk',sans-serif}.muted{color:#71717a;font-size:13px;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input{width:100%;padding:12px 14px;border:2px solid #ede9fe;border-radius:14px;background:#f5f4f2;font-weight:700}.btn{border:none;border-radius:14px;padding:12px 14px;font-weight:900;color:#fff;cursor:pointer}.a{background:linear-gradient(135deg,#7c3aed,#a855f7)}.b{background:linear-gradient(135deg,#14b8a6,#06b6d4)}.c{background:linear-gradient(135deg,#f59e0b,#f97316)}.g{background:linear-gradient(135deg,#22c55e,#16a34a)}.meal-card,.ex-card{border:2px solid #ede9fe;border-radius:18px;background:#fff;padding:14px;margin-top:10px}.meal-top,.ex-hdr{display:flex;gap:12px;align-items:flex-start}.meal-kcal{margin-left:auto;font:900 18px 'Space Grotesk',sans-serif}.meal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.meal-alt{display:none;margin-top:10px;border-top:1px solid #ede9fe;padding-top:10px}.meal-alt.on{display:block}.thumb{width:96px;height:76px;border-radius:12px;overflow:hidden;background:#111;flex:0 0 96px}.thumb img{width:100%;height:100%;object-fit:cover}.meal-items{margin:10px 0 0;padding:0;list-style:none}.meal-items li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #f3f2ee;font-size:13px}.meal-items li:last-child{border-bottom:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#ede9fe;color:#7c3aed;font-size:11px;font-weight:800;margin-right:6px}.history-item{border-top:1px solid #ede9fe;padding:10px 0}.del{margin-left:8px;border:none;background:#fef2f2;color:#dc2626;border-radius:999px;padding:4px 10px;font-weight:800;cursor:pointer}.ok{background:#ecfdf5;color:#15803d}.bad{background:#fef2f2;color:#dc2626}.warn{background:#fff7ed;color:#ea580c}.scanbox{min-height:300px;border-radius:18px;background:#000;overflow:hidden;border:2px solid #ede9fe}.note{border-left:3px solid #7c3aed;padding-left:10px;margin-top:10px;color:#18181b;background:#ede9fe33;border-radius:0 8px 8px 0;padding-top:8px;padding-bottom:8px}.meter{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7c3aed,#14b8a6,#22c55e)}.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid #ede9fe;display:flex;justify-content:center;gap:8px;padding:8px 12px}.barbtn{border:none;background:#fff;color:#71717a;border-radius:12px;padding:9px 10px;font-size:12px;font-weight:800}.barbtn.on{background:#ede9fe;color:#7c3aed}.ex-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ex-body{display:none;border-top:1px solid #ede9fe;margin-top:10px;padding-top:10px}.ex-card.open .ex-body{display:block}.ex-side{flex:1}.mini{font-size:11px;color:#71717a}.opt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.opt button{border:none;border-radius:999px;background:#ede9fe;color:#7c3aed;padding:8px 10px;font-weight:800;cursor:pointer}.alt-panel{display:none;margin-top:10px;background:#f5f4f2;border-radius:12px;padding:12px}.alt-panel.on{display:block}.alt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.alt-item{background:#fff;border:2px solid #ede9fe;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer}.chip{display:inline-block;padding:4px 8px;border-radius:999px;background:#ede9fe;color:#7c3aed;font-size:11px;font-weight:800}.scan-result{margin-top:10px;padding:12px;border-radius:12px;background:#f5f4f2}.stat{background:#ede9fe;border-radius:14px;padding:12px}.stat .k{font-size:11px;color:#71717a;font-weight:800;text-transform:uppercase}.stat .v{font:900 18px 'Space Grotesk',sans-serif;margin-top:4px}.daytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.daytab{border:2px solid #ede9fe;background:#fff;border-radius:16px;padding:12px;font-weight:800;cursor:pointer}.daytab.on{background:#ede9fe;color:#7c3aed}.daybox{display:none}.daybox.on{display:block}.small{font-size:12px;color:#71717a}.spin{font-weight:900}.delwrap{display:flex;justify-content:space-between;align-items:center;gap:8px}.rating{font-weight:900}.rating.ok{color:#15803d}.rating.warn{color:#ea580c}.rating.bad{color:#dc2626}@media(max-width:720px){.row,.alt-grid,.daytabs{grid-template-columns:1fr}}</style></head><body><header><div class="top"><div class="brand"><div class="logo">TH</div><div><div class="title">TrainHard PWA</div><div class="sub">Cardio incluso, dieta con feedback, barcode, storico modificabile</div></div></div><div class="chip">PWA</div></div><div class="nav"><button class="tab on" onclick="show('workout',this)">Allenamento</button><button class="tab" onclick="show('nutrition',this)">Dieta</button><button class="tab" onclick="show('scanner',this)">Scanner</button><button class="tab" onclick="show('progress',this)">Progressi</button></div></header><main class="wrap"><section id="workout" class="sec on"></section><section id="nutrition" class="sec"></section><section id="scanner" class="sec"></section><section id="progress" class="sec"></section></main><div class="tabbar"><button class="barbtn on" onclick="show('workout',this)">Scheda</button><button class="barbtn" onclick="show('nutrition',this)">Dieta</button><button class="barbtn" onclick="show('scanner',this)">Scanner</button><button class="barbtn" onclick="show('progress',this)">Storico</button></div><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});const imgs={bench:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/ec63a2d68764eb7ea5f46d1f98bb6ad26c7222f7.jpg',fly:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/7c00a35e4f6ba3f525f95c92ab1fa1627f3c3df0.jpg',dips:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/5cbdba4192b95fcf908d46b8403992542b9f5159.jpg',pushdown:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/6576b540cf2ff7ac4af7627aecfcca9bbb315f00.jpg',french:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/f45de260e0228659e79450d0f52052b1f7dd364d.jpg',lat:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/aa4433fd2f0038b26fc71ff43ff026f4560a1f47.jpg',row:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/921c2b5eef642b3906d100221fb577233ad4657a.jpg',face:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/6ee8073d1a7a6c22400be03400ea131e68399240.jpg',curl:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/be67fd4fe75d17425ddb78ffc549221c4b7b3a74.jpg',pulley:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/f070d195b13e6e2061504e0889e3ef61f1e4ca47.jpg',squat:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/0a1a65759a4eedd91a4c4bc6e165c02a25f15552.jpg',rdl:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/43fd497edab83bd9a442927d6e4c5d2b6d3f0fd7.jpg',hip:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/71b8f7b196ce58463003c8885d45f8de75e4cad0.jpg',curlleg:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/3568670e4103ed951a898e8d27e704b90d9b803d.jpg',lunge:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/2c1c9c0f4ca9f3dbd14c0b8b5d6b9f0f6f9e1f3d.jpg',raise:'https://pplx-res.cloudinary.com/image/upload/pplx_search_images/8a0f5a6c6d7d7f1d9f0a0b0c0d0e0f1a2b3c4d5e.jpg'};const plan={1:[['Panca piana con bilanciere','4x10-12 · 60s','bench',['Panca con manubri','Chest press','Push-up inclinati']],['Croci ai cavi','3x12-15 · 45s','fly',['Croci manubri','Pec deck','Crossover basso']],['Dips alle parallele','3x10-12 · 60s','dips',['Dips su panca','Pushdown rope','French press']],['Plank crunch inverso','3x45s · 30s','bench',['Side plank','Ab wheel','Leg raises']],['HIIT finale','12 min','french',['Bike 30s','Tapis inclinato','Jump rope']]],2:[['Lat machine presa larga','4x10-12 · 60s','lat',['Trazioni assistite','Pulldown presa stretta','T-Bar row']],['Rematore con bilanciere','4x10 · 60s','row',['Rematore manubrio','Seated cable row','TRX row']],['Curl con bilanciere','3x12 · 45s','curl',['Curl alternato','Hammer curl','Curl Scott']],['Alzate laterali + lento avanti','3x15-12 · 45s','raise',['Arnold press','Shoulder press','Face pull']],['Circuit finisher','10 min','pulley',['Burpees 20s','Mountain climbers','Sprint sul posto']]],3:[['Squat con bilanciere','4x10-12 · 90s','squat',['Leg press','Goblet squat','Hack squat']],['Stacco rumeno','4x10 · 90s','rdl',['Leg curl','Good morning','Hip hinge band']],['Hip thrust con bilanciere','3x15 · 60s','hip',['Glute bridge','Cable pull-through','Step up']],['Affondi camminati','3x12 gamba · 60s','lunge',['Affondi statici','Bulgarian split squat','Step up manubri']],['HIIT ciclismo','15 min','curlleg',['Bike 40/20','Tapis 1 min','Cyclette costante']]]};const meals=[{id:'col',t:'Colazione',k:420,g:'35P 45C 12F',i:[['3 uova', '150 g'],['Pane integrale', '80 g'],['Verdure', 'q.b.'],['Frutta', '1 porzione']],alt:['Yogurt greco 0% 250 g + avena 50 g','Frittata albumi 250 g + pane 70 g','Skyr 250 g + banana 120 g'],rating:'ok',ratingText:'Buona per il taglio calorico.'},{id:'spunt1',t:'Spuntino mattina',k:180,g:'20P 18C 5F',i:[['Yogurt proteico', '200 g'],['Mandorle', '15 g']],alt:['Barretta proteica 1 pz','Budino proteico 1 vasetto','Shake proteico 30 g'],rating:'ok',ratingText:'Buono se scegli un prodotto alto in proteine e basso in zuccheri.'},{id:'pranzo',t:'Pranzo',k:560,g:'45P 60C 15F',i:[['Riso basmati', '90 g'],['Pollo', '180 g'],['Verdure', '200 g'],['Olio EVO', '10 g']],alt:['Pasta integrale 90 g + tonno 160 g','Tacchino 200 g + patate 300 g','Merluzzo 220 g + riso 80 g'],rating:'ok',ratingText:'Buono, completo e bilanciato.'},{id:'spunt2',t:'Spuntino pomeriggio',k:200,g:'18P 20C 6F',i:[['Barretta proteica', '1 pz'],['Frutta', '1 porzione']],alt:['Budino proteico 200 g','Yogurt greco 250 g','YouTube proteico', ''],rating:'warn',ratingText:'Meglio se scegli una fonte proteica vera, non solo dolci fitness.'},{id:'cena',t:'Cena',k:520,g:'40P 35C 18F',i:[['Tacchino', '180 g'],['Patate', '250 g'],['Insalata', 'q.b.'],['Olio EVO', '10 g']],alt:['Pollo 200 g + riso 70 g','Merluzzo 250 g + patate 250 g','Uova 3 + verdure + pane 50 g'],rating:'ok',ratingText:'Buona per recupero e sazietà.'}];function show(id,btn){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));document.querySelectorAll('.tab,.barbtn').forEach(b=>b.classList.remove('on'));document.getElementById(id).classList.add('on');btn.classList.add('on')}function exCard(x){return `<div class='ex-card'><div class='ex-hdr' onclick='toggleEx(this.parentElement)'><div class='thumb'><img src='${imgs[x[2]]}'></div><div class='ex-side'><div class='big' style='font-size:15px'>${x[0]}</div><div class='ex-meta'><span class='tag'>${x[1]}</span><span class='tag'>Cardio incluso</span></div><div class='mini'>Sostituzioni e video tutorial disponibili.</div></div></div><div class='ex-body'><div><span class='chip'>Alternativa</span></div><div class='opt'>${x[3].map(v=>`<button onclick="this.parentElement.parentElement.querySelector('.alt-panel').classList.add('on');this.parentElement.parentElement.querySelector('.alt-panel').dataset.target='${v}'">${v}</button>`).join('')}</div><div class='alt-panel'><div class='mini'>Sostituzione applicata: <span class='spin'></span></div></div></div></div>`}function workout(){return `<div class='daytabs'><button class='daytab on' onclick='showDay(1,this)'>Day 1</button><button class='daytab' onclick='showDay(2,this)'>Day 2</button><button class='daytab' onclick='showDay(3,this)'>Day 3</button></div>${[1,2,3].map(n=>`<div id='day${n}' class='daybox ${n===1?'on':''}'>${plan[n].map(exCard).join('')}</div>`).join('')}<div class='card note'>Ogni giorno ha il cardio già dentro la scheda: non serve una sezione separata.</div>`}function showDay(n,btn){btn.parentElement.querySelectorAll('.daytab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.querySelectorAll('.daybox').forEach(b=>b.classList.remove('on'));document.getElementById('day'+n).classList.add('on')}function toggleEx(el){el.classList.toggle('open')}function nutrition(){const total=meals.reduce((s,m)=>s+m.k,0);const macro='240P 238C 56F';return `<div class='card' style='background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff'><div class='big'>Target giornaliero</div><div style='font:900 54px "Space Grotesk",sans-serif;line-height:1'>${total} <span style='font-size:18px;font-weight:400'>kcal</span></div><div class='row' style='grid-template-columns:repeat(3,1fr);margin-top:10px'><div class='stat'><div class='k'>Pasti</div><div class='v'>5</div></div><div class='stat'><div class='k'>Macro</div><div class='v'>${macro}</div></div><div class='stat'><div class='k'>Obiettivo</div><div class='v'>Cut</div></div></div></div>${meals.map(m=>`<div class='meal-card' id='meal-${m.id}' data-kcal='${m.k}'><div class='meal-top'><div><div class='chip'>${m.t}</div><div class='big' style='font-size:15px;margin-top:8px'>${m.t}</div><div class='muted'>Registrazione pasti con calorie giornaliere e feedback qualità.</div></div><div class='meal-kcal'>${m.k}</div></div><div class='meal-items'>${m.i.map(v=>`<li><span>${v[0]}</span><strong>${v[1]}</strong></li>`).join('')}</div><div class='meal-actions'><button class='btn g' onclick="recordMeal('${m.id}')">Registra</button><button class='btn a' onclick="swapMeal('${m.id}')">Sostituzione</button></div><div class='meal-alt' id='alt-${m.id}'></div><div class='note'>Feedback: <span class='rating ${m.rating}'>${m.ratingText}</span></div></div>`).join('')}<div class='card'><div class='big'>Storico pasti</div><div class='muted'>Puoi cancellare singole registrazioni dal log.</div><div id='mealhist' class='history'></div></div>`}function renderMealHist(){const el=document.getElementById('mealhist');const log=JSON.parse(localStorage.getItem('th_meals')||'[]');if(!log.length){el.innerHTML='<div class="muted">Nessun pasto registrato ancora.</div>';return}el.innerHTML=log.slice().reverse().map((x,idx)=>`<div class='history-item'><div class='delwrap'><div><strong>${x.d}</strong><div class='small'>${x.t} · ${x.k} kcal</div></div><button class='del' onclick='deleteMeal(${log.length-1-idx})'>Elimina</button></div></div>`).join('')}function recordMeal(id){const m=meals.find(x=>x.id===id);let log=JSON.parse(localStorage.getItem('th_meals')||'[]');log.push({d:new Date().toLocaleDateString('it-IT'),t:m.t,k:m.k});localStorage.setItem('th_meals',JSON.stringify(log));renderMealHist()}function deleteMeal(i){let log=JSON.parse(localStorage.getItem('th_meals')||'[]');log.splice(i,1);localStorage.setItem('th_meals',JSON.stringify(log));renderMealHist()}function swapMeal(id){const m=meals.find(x=>x.id===id);const alt=document.getElementById('alt-'+id);alt.innerHTML='<div class="mini">Seleziona la sostituzione che vuoi applicare.</div><div class="alt-grid">'+m.alt.map(a=>`<div class='alt-item' onclick="applySwap('${id}','${a.replace(/'/g,'\' )}')">${a}</div>`).join('')+'</div>';alt.classList.add('on')}function applySwap(id,a){const m=meals.find(x=>x.id===id);const box=document.getElementById('meal-'+id);const top=box.querySelector('.meal-top div');top.innerHTML=`<div class='chip'>${m.t}</div><div class='big' style='font-size:15px;margin-top:8px'>${a}</div><div class='muted'>Sostituzione applicata al pasto.</div>`;const it=box.querySelector('.meal-items');it.innerHTML=`<li><span>Nuovo pasto</span><strong>${a}</strong></li>`;box.querySelector('.meal-alt').classList.remove('on')}let scanner=null;function scannerUI(){document.getElementById('scanner').innerHTML=`<div class='card'><div class='big'>Scanner barcode</div><div class='muted'>Lettura pensata per barcode, con camera posteriore e feedback prodotto buono/non buono.</div><div id='reader' class='scanbox' style='margin-top:10px'></div><div class='row' style='margin-top:10px'><button class='btn a' onclick='startScan()'>Avvia camera</button><button class='btn c' onclick='stopScan()'>Ferma</button></div><input id='code' class='input' placeholder='Codice barcode' style='margin-top:10px'><div class='row' style='margin-top:10px'><button class='btn b' onclick='lookup()'>Cerca prodotto</button><button class='btn g' onclick='rateFood()'>Feedback cibo</button></div><div id='scanout' class='scan-result'>Nessun prodotto scansionato.</div></div>`}async function startScan(){try{if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}}scanner=new Html5Qrcode('reader');await scanner.start({facingMode:{exact:'environment'}},{fps:18,qrbox:{width:300,height:180},aspectRatio:1.6,disableFlip:true},txt=>{document.getElementById('code').value=txt;lookup(txt)});document.getElementById('scanout').innerHTML='Camera attiva. Inquadra un barcode.'}catch(e){document.getElementById('scanout').innerHTML='Camera non disponibile.'}}async function stopScan(){if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}}}async function lookup(){const code=document.getElementById('code').value.trim();if(!code)return;document.getElementById('scanout').innerHTML='Ricerca prodotto...';try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');const j=await r.json();if(j.status===1){const p=j.product||{};const nk=Number(p.nutriments?.['nutriscore_score']??NaN);let cls='warn',txt='Da valutare';if(String(p.nutriscore_grade||'').match(/^[abc]$/i)||nk<=10) {cls='ok'; txt='Buono'} else if(String(p.nutriscore_grade||'').match(/^[de]$/i)||nk>20) {cls='bad'; txt='Poco buono'};document.getElementById('scanout').innerHTML=`<strong>${p.product_name||'Prodotto trovato'}</strong><br><span class='small'>Marca: ${p.brands||'n/d'} · Kcal/100g: ${p.nutriments?.['energy-kcal_100g']||'n/d'}</span><br><span class='tag ${cls}'>Feedback: ${txt}</span>`}else document.getElementById('scanout').innerHTML='Prodotto non trovato.'}catch(e){document.getElementById('scanout').innerHTML='Errore ricerca.'}}function rateFood(){const txt=document.getElementById('code').value.trim();document.getElementById('scanout').innerHTML=`<span class='tag warn'>Valutazione manuale: inserisci un barcode per ottenere il feedback.</span>`}function progressUI(){const hist=JSON.parse(localStorage.getItem('th_hist')||'[]');return `<div class='card'><div class='big'>Progressi</div><div class='muted'>Peso, vita e altri dati salvati localmente. Puoi rimuovere una registrazione dallo storico.</div><div class='row' style='margin-top:10px'><input id='w' class='input' placeholder='Peso kg'><input id='wa' class='input' placeholder='Vita cm'></div><div class='row' style='margin-top:10px'><button class='btn g' onclick='saveProg()'>Salva</button><button class='btn c' onclick='calcBMI()'>BMI</button></div><div id='bmiout' class='note'>BMI non calcolato.</div></div><div class='card'><div class='big'>Storico</div><div id='hist'></div></div>`}function saveProg(){const w=document.getElementById('w').value,wa=document.getElementById('wa').value;let h=JSON.parse(localStorage.getItem('th_hist')||'[]');h.push({d:new Date().toLocaleDateString('it-IT'),w,wa});localStorage.setItem('th_hist',JSON.stringify(h));renderHist()}function deleteProg(i){let h=JSON.parse(localStorage.getItem('th_hist')||'[]');h.splice(i,1);localStorage.setItem('th_hist',JSON.stringify(h));renderHist()}function renderHist(){const el=document.getElementById('hist');const h=JSON.parse(localStorage.getItem('th_hist')||'[]');el.innerHTML=h.length?h.slice().reverse().map((x,idx)=>`<div class='history-item'><div class='delwrap'><div><strong>${x.d}</strong><div class='small'>Peso: ${x.w||'-'} kg · Vita: ${x.wa||'-'} cm</div></div><button class='del' onclick='deleteProg(${h.length-1-idx})'>Elimina</button></div></div>`).join(''):'<div class="muted">Nessun dato salvato ancora.</div>'}function calcBMI(){const w=parseFloat(document.getElementById('w').value),h=1.78;if(!w){document.getElementById('bmiout').innerHTML='Inserisci il peso.';return}const bmi=(w/(h*h)).toFixed(1);document.getElementById('bmiout').innerHTML=`BMI stimato: <strong>${bmi}</strong>`}function renderAll(){document.getElementById('workout').innerHTML=workout();document.getElementById('nutrition').innerHTML=nutrition();scannerUI();document.getElementById('progress').innerHTML=progressUI();renderMealHist();renderHist()}renderAll();</script></body></html>
