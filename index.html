<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1120"><title>TrainHard PWA</title><link rel="manifest" href="manifest.json"><style>:root{--bg:#0b1120;--panel:#111827;--line:rgba(255,255,255,.08);--txt:#e5eefc;--muted:#94a3b8;--accent:#8b5cf6;--accent2:#14b8a6;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444}*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden}body{font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#172554 0%,var(--bg) 55%);color:var(--txt)}header{position:sticky;top:0;z-index:100;background:rgba(11,17,32,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#fff}.title{font-weight:900;font-size:22px}.sub{font-size:12px;color:var(--muted)}.hero{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(20,184,166,.10))}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:800}.nav{display:flex;gap:8px;overflow:auto;padding:12px 0 8px;position:sticky;top:82px;z-index:95;background:linear-gradient(180deg,rgba(11,17,32,.98),rgba(11,17,32,.85))}.tab,.daytab,.barbtn,.btn,.del,.alt-item,.optbtn{cursor:pointer}.tab{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap;flex:0 0 auto}.tab.on{background:linear-gradient(135deg,var(--accent),#a855f7);border-color:transparent}.sec{display:none}.sec.on{display:block}.card{background:linear-gradient(180deg,rgba(17,24,39,.96),rgba(15,23,42,.96));border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 16px 38px rgba(0,0,0,.24);margin-top:14px}.big{font-weight:900;font-size:18px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);border-radius:14px;padding:12px 14px;font-weight:700}.btn{border:none;border-radius:14px;padding:12px 14px;font-weight:900;color:#fff}.a{background:linear-gradient(135deg,var(--accent),#a855f7)}.b{background:linear-gradient(135deg,var(--accent2),#06b6d4)}.c{background:linear-gradient(135deg,var(--warn),#f97316)}.g{background:linear-gradient(135deg,var(--good),#16a34a)}.daytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.daytab{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);border-radius:16px;padding:12px;font-weight:800}.daytab.on{background:linear-gradient(135deg,var(--accent),#a855f7)}.box{display:none}.box.on{display:block}.ex{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.03);margin-top:10px}.exh{display:flex;gap:12px;padding:12px;align-items:center}.media{width:108px;height:86px;flex:0 0 108px;border-radius:14px;overflow:hidden;background:#111;position:relative}.media img{width:100%;height:100%;object-fit:cover;display:block}.media:after{content:'IMG';position:absolute;right:6px;top:6px;background:rgba(11,17,32,.75);color:#fff;font-size:10px;font-weight:900;padding:3px 6px;border-radius:999px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:800;margin-right:6px}.note{border-left:3px solid var(--accent);padding-left:10px;color:#dbe7f7;font-size:13px;margin-top:10px}.meal-card{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.03);padding:14px;margin-top:10px}.meal-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.meal-tag{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:800}.meal-kcal{font-weight:900;font-size:18px}.meal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.meal-alt{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.meal-alt.on{display:block}.history-item{border-top:1px solid var(--line);padding:10px 0}.delwrap{display:flex;justify-content:space-between;align-items:center;gap:8px}.del{border:none;background:rgba(239,68,68,.15);color:#fca5a5;border-radius:999px;padding:6px 10px;font-weight:800}.scanbox{padding:14px;border:1px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.03)}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px}.stat .k{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.stat .v{font-weight:900;font-size:20px}.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(11,17,32,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 12px}.barbtn{border:none;background:rgba(255,255,255,.04);color:var(--txt);border-radius:12px;padding:9px 10px;font-size:12px;font-weight:800}.barbtn.on{background:rgba(139,92,246,.22);color:#ddd6fe}@media(max-width:720px){.row,.daytabs,.statgrid{grid-template-columns:1fr}}.img-fallback{display:grid;place-items:center;height:100%;width:100%;background:linear-gradient(135deg,#1f2937,#111827);color:#fff;font-weight:900;font-size:28px;letter-spacing:1px}</style></head><body><header><div class="wrap"><div class="top"><div class="brand"><div class="logo">TH</div><div><div class="title">TrainHard PWA</div><div class="sub">Immagini locali e scanner senza camera</div></div></div><div class="chip">Fixed</div></div><div class="hero"><div class="big">Immagini e scanner sistemati</div><div class="muted">Le immagini dei giorni 2 e 3 sono file locali, e la camera è stata rimossa: resta un input barcode stabile.</div><div class="chips"><span class="chip">Local images</span><span class="chip">No camera</span><span class="chip">Dark theme</span></div></div><div class="nav"><button class="tab on" onclick="show('workout',this)">Allenamento</button><button class="tab" onclick="show('nutrition',this)">Dieta</button><button class="tab" onclick="show('scanner',this)">Scanner</button><button class="tab" onclick="show('progress',this)">Progressi</button></div></div></header><main class="wrap"><section id="workout" class="sec on"></section><section id="nutrition" class="sec"></section><section id="scanner" class="sec"></section><section id="progress" class="sec"></section></main><div class="tabbar"><button class="barbtn on" onclick="show('workout',this)">Scheda</button><button class="barbtn" onclick="show('nutrition',this)">Dieta</button><button class="barbtn" onclick="show('scanner',this)">Scanner</button><button class="barbtn" onclick="show('progress',this)">Storico</button></div><script>const imgdir='assets/';const imgs={bench:imgdir+'bench.jpg',fly:imgdir+'fly.jpg',dips:imgdir+'dips.jpg',pushdown:imgdir+'pushdown.jpg',french:imgdir+'french.jpg',lat:imgdir+'lat.jpg',row:imgdir+'row.jpg',face:imgdir+'face.jpg',curl:imgdir+'curl.jpg',pulley:imgdir+'pulley.jpg',squat:imgdir+'squat.jpg',rdl:imgdir+'rdl.jpg',hip:imgdir+'hip.jpg',lunge:imgdir+'lunge.jpg',curlleg:imgdir+'curlleg.jpg'};const plan={1:[['Panca piana con bilanciere','4x10-12 · 60s','bench',['Panca con manubri','Chest press','Push-up inclinati']],['Croci ai cavi','3x12-15 · 45s','fly',['Croci manubri','Pec deck','Crossover basso']],['Dips alle parallele','3x10-12 · 60s','dips',['Dips su panca','Pushdown rope','French press']],['Plank crunch inverso','3x45s · 30s','bench',['Side plank','Ab wheel','Leg raises']],['HIIT finale','12 min','french',['Bike 30s','Tapis inclinato','Jump rope']]],2:[['Lat machine presa larga','4x10-12 · 60s','lat',['Trazioni assistite','Pulldown presa stretta','T-Bar row']],['Rematore con bilanciere','4x10 · 60s','row',['Rematore manubrio','Seated cable row','TRX row']],['Face pull','3x15 · 45s','face',['Rear delt fly','Cable external rotation','Band pull-apart']],['Curl con bilanciere','3x12 · 45s','curl',['Curl alternato','Hammer curl','Curl Scott']],['Circuit finisher','10 min','pulley',['Burpees 20s','Mountain climbers','Sprint sul posto']]],3:[['Squat con bilanciere','4x10-12 · 90s','squat',['Leg press','Goblet squat','Hack squat']],['Stacco rumeno','4x10 · 90s','rdl',['Leg curl','Good morning','Hip hinge band']],['Hip thrust con bilanciere','3x15 · 60s','hip',['Glute bridge','Cable pull-through','Step up']],['Affondi camminati','3x12 gamba · 60s','lunge',['Affondi statici','Bulgarian split squat','Step up manubri']],['HIIT ciclismo','15 min','curlleg',['Bike 40/20','Tapis 1 min','Cyclette costante']]]};const meals=[{id:'col',t:'Colazione',k:420,i:[['3 uova','150 g'],['Pane integrale','80 g'],['Verdure','q.b.'],['Frutta','1 porzione']],alt:['Yogurt greco 0% 250 g + avena 50 g','Frittata albumi 250 g + pane 70 g','Skyr 250 g + banana 120 g'],rating:'ok',rt:'Buona per il taglio calorico.'},{id:'spunt1',t:'Spuntino mattina',k:180,i:[['Yogurt proteico','200 g'],['Mandorle','15 g']],alt:['Barretta proteica 1 pz','Budino proteico 1 vasetto','Shake proteico 30 g'],rating:'ok',rt:'Buono se scegli un prodotto alto in proteine.'},{id:'pranzo',t:'Pranzo',k:560,i:[['Riso basmati','90 g'],['Pollo','180 g'],['Verdure','200 g'],['Olio EVO','10 g']],alt:['Pasta integrale 90 g + tonno 160 g','Tacchino 200 g + patate 300 g','Merluzzo 220 g + riso 80 g'],rating:'ok',rt:'Buono, completo e bilanciato.'},{id:'spunt2',t:'Spuntino pomeriggio',k:200,i:[['Barretta proteica','1 pz'],['Frutta','1 porzione']],alt:['Budino proteico 200 g','Yogurt greco 250 g','Shake proteico 30 g'],rating:'warn',rt:'Meglio se scegli una fonte proteica vera.'},{id:'cena',t:'Cena',k:520,i:[['Tacchino','180 g'],['Patate','250 g'],['Insalata','q.b.'],['Olio EVO','10 g']],alt:['Pollo 200 g + riso 70 g','Merluzzo 250 g + patate 250 g','Uova 3 + verdure + pane 50 g'],rating:'ok',rt:'Buona per recupero e sazietà.'}];function show(id,btn){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));document.querySelectorAll('.tab,.barbtn').forEach(b=>b.classList.remove('on'));document.getElementById(id).classList.add('on');btn.classList.add('on')}function showDay(n,btn){btn.parentElement.querySelectorAll('.daytab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.querySelectorAll('.box').forEach(b=>b.classList.remove('on'));document.getElementById('day'+n).classList.add('on')}function workout(){return `<div class='daytabs'><button class='daytab on' onclick='showDay(1,this)'>Day 1</button><button class='daytab' onclick='showDay(2,this)'>Day 2</button><button class='daytab' onclick='showDay(3,this)'>Day 3</button></div>${[1,2,3].map(n=>`<div id='day${n}' class='box ${n===1?'on':''}'>${plan[n].map(x=>`<div class='ex'><div class='exh'><div class='media'><img src='${imgs[x[2]]}' onerror="this.style.display='none';this.parentElement.innerHTML='<div class=img-fallback>${x[2].toUpperCase()}</div>'"></div><div style='flex:1'><div class='big' style='font-size:15px'>${x[0]}</div><div><span class='pill'>${x[1]}</span><span class='pill'>Cardio incluso</span></div><div class='muted' style='margin-top:6px'>${x[3].join(' · ')}</div></div></div></div>`).join('')}</div>`).join('')}<div class='card note'>Cardio integrato nei 3 allenamenti: lo scroll resta libero.</div>`}function nutrition(){const total=meals.reduce((s,m)=>s+m.k,0);return `<div class='card' style='background:linear-gradient(135deg,#7c3aed,#14b8a6);color:#fff'><div class='big'>Target giornaliero</div><div style='font-weight:900;font-size:54px;line-height:1'>${total} <span style='font-size:18px;font-weight:400'>kcal</span></div><div class='statgrid'><div class='stat'><div class='k'>Pasti</div><div class='v'>5</div></div><div class='stat'><div class='k'>Proteine</div><div class='v'>158 g</div></div><div class='stat'><div class='k'>Obiettivo</div><div class='v'>Cut</div></div></div></div>${meals.map(m=>`<div class='meal-card' id='meal-${m.id}'><div class='meal-top'><div><div class='meal-tag'>${m.t}</div><div class='big' style='font-size:15px;margin-top:8px'>${m.t}</div><div class='muted'>Registrazione pasti, calorie giornaliere e feedback qualità.</div></div><div class='meal-kcal'>${m.k}</div></div><ul class='meal-items'>${m.i.map(v=>`<li><span>${v[0]}</span><strong>${v[1]}</strong></li>`).join('')}</ul><div class='meal-actions'><button class='btn g' onclick="recordMeal('${m.id}')">Registra</button><button class='btn a' onclick="swapMeal('${m.id}')">Sostituzione</button></div><div class='meal-alt' id='alt-${m.id}'></div><div class='note'>Feedback: <span class='rating ${m.rating}'>${m.rt}</span></div></div>`).join('')}<div class='card'><div class='big'>Storico pasti</div><div class='muted'>Puoi eliminare ogni registrazione singolarmente.</div><div id='mealhist'></div></div>`}function renderMealHist(){const el=document.getElementById('mealhist');const log=JSON.parse(localStorage.getItem('th_meals')||'[]');el.innerHTML=!log.length?'<div class="muted" style="margin-top:10px">Nessun pasto registrato ancora.</div>':log.map((x,i)=>`<div class='history-item'><div class='delwrap'><div><strong>${x.d}</strong><div class='small'>${x.t} · ${x.k} kcal</div></div><button class='del' onclick='deleteMeal(${i})'>Elimina</button></div></div>`).join('')}function recordMeal(id){const m=meals.find(x=>x.id===id);const log=JSON.parse(localStorage.getItem('th_meals')||'[]');log.push({d:new Date().toLocaleDateString('it-IT'),t:m.t,k:m.k});localStorage.setItem('th_meals',JSON.stringify(log));renderMealHist()}function deleteMeal(i){const log=JSON.parse(localStorage.getItem('th_meals')||'[]');log.splice(i,1);localStorage.setItem('th_meals',JSON.stringify(log));renderMealHist()}function swapMeal(id){const m=meals.find(x=>x.id===id);const alt=document.getElementById('alt-'+id);alt.innerHTML='<div class="small">Seleziona la sostituzione da applicare al pasto.</div><div class="alt-grid">'+m.alt.map(a=>`<div class='alt-item' onclick="applySwap('${id}','${a.replace(/'/g,'\'')}')">${a}</div>`).join('')+'</div>';alt.classList.add('on')}function applySwap(id,a){const m=meals.find(x=>x.id===id);const box=document.getElementById('meal-'+id);box.querySelector('.meal-top div').innerHTML=`<div class='meal-tag'>${m.t}</div><div class='big' style='font-size:15px;margin-top:8px'>${a}</div><div class='muted'>Sostituzione applicata al pasto.</div>`;box.querySelector('.meal-items').innerHTML=`<li><span>Nuovo pasto</span><strong>${a}</strong></li>`;box.querySelector('.meal-alt').classList.remove('on')}function scannerUI(){document.getElementById('scanner').innerHTML=`<div class='card'><div class='big'>Scanner barcode</div><div class='muted'>La camera è rimossa. Inserisci il barcode nell'input e cerca il prodotto.</div><input id='code' class='input' placeholder='Codice barcode' style='margin-top:10px'><div class='row' style='margin-top:10px'><button class='btn b' onclick='lookup()'>Cerca prodotto</button><button class='btn g' onclick='manualFeedback()'>Feedback manuale</button></div><div id='scanout' class='scanbox' style='margin-top:10px'>Nessun prodotto scansionato.</div></div>`}async function lookup(){const code=document.getElementById('code').value.trim();if(!code)return;document.getElementById('scanout').innerHTML='Ricerca prodotto...';try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');const j=await r.json();if(j.status===1){const p=j.product||{};const score=String(p.nutriscore_grade||'').toLowerCase();const s=score&&['a','b','c'].includes(score)?'ok':(score&&['d','e'].includes(score)?'bad':'warn');const label=score&&['a','b','c'].includes(score)?'Buono':(score&&['d','e'].includes(score)?'Poco buono':'Da valutare');document.getElementById('scanout').innerHTML=`<strong>${p.product_name||'Prodotto trovato'}</strong><br><span class='small'>Marca: ${p.brands||'n/d'} · Kcal/100g: ${p.nutriments?.['energy-kcal_100g']||'n/d'}</span><br><span class='chip ${s}'>Feedback: ${label}</span>`}else document.getElementById('scanout').innerHTML='Prodotto non trovato.'}catch(e){document.getElementById('scanout').innerHTML='Errore ricerca.'}}function manualFeedback(){document.getElementById('scanout').innerHTML='<span class="chip warn">Inserisci un barcode per ottenere un feedback automatico.</span>'}function progressUI(){return `<div class='card'><div class='big'>Progressi</div><div class='muted'>Peso, vita e storico con eliminazione singola.</div><div class='row' style='margin-top:10px'><input id='w' class='input' placeholder='Peso kg'><input id='wa' class='input' placeholder='Vita cm'></div><div class='row' style='margin-top:10px'><button class='btn g' onclick='saveProg()'>Salva</button><button class='btn c' onclick='calcBMI()'>BMI</button></div><div id='bmiout' class='note'>BMI non calcolato.</div></div><div class='card'><div class='big'>Storico</div><div id='hist'></div></div>`}function saveProg(){const w=document.getElementById('w').value,wa=document.getElementById('wa').value;const log=JSON.parse(localStorage.getItem('th_hist')||'[]');log.push({d:new Date().toLocaleDateString('it-IT'),w,wa});localStorage.setItem('th_hist',JSON.stringify(log));renderHist()}function deleteProg(i){const log=JSON.parse(localStorage.getItem('th_hist')||'[]');log.splice(i,1);localStorage.setItem('th_hist',JSON.stringify(log));renderHist()}function renderHist(){const el=document.getElementById('hist');const log=JSON.parse(localStorage.getItem('th_hist')||'[]');el.innerHTML=!log.length?'<div class="muted" style="margin-top:10px">Nessun dato salvato ancora.</div>':log.map((x,i)=>`<div class='history-item'><div class='delwrap'><div><strong>${x.d}</strong><div class='small'>Peso: ${x.w||'-'} kg · Vita: ${x.wa||'-'} cm</div></div><button class='del' onclick='deleteProg(${i})'>Elimina</button></div></div>`).join('')}function calcBMI(){const w=parseFloat(document.getElementById('w').value);const h=1.78;if(!w){document.getElementById('bmiout').innerHTML='Inserisci il peso.';return}document.getElementById('bmiout').innerHTML='BMI stimato: <strong>'+(w/(h*h)).toFixed(1)+'</strong>'}function renderAll(){document.getElementById('workout').innerHTML=workout();document.getElementById('nutrition').innerHTML=nutrition();scannerUI();document.getElementById('progress').innerHTML=progressUI();renderMealHist();renderHist()}renderAll();</script></body></html>
